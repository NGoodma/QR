name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest opencv-python-headless zxing-cpp
      - run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BOT_NAME: ${{ github.event.repository.name }}
      OWNER: ${{ github.repository_owner }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Skip if secrets are not set yet
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::Add VERCEL_TOKEN and TELEGRAM_BOT_TOKEN to repo secrets to deploy"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ok == 'true'
        run: python3 scripts/deploy.py
